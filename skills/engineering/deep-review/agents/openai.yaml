interface:
  display_name: "Deep Review"
  short_description: "Fast read-only git diff review (no script dependency)"
  long_description: "Runs git diff directly, then writes production-focused findings with severity/confidence and a merge decision. Default mode is instant (one diff command + one review). Use deep mode only for large/security-sensitive changes."
  default_prompt: "Use $deep-review. Run one git diff command, then write the full review immediately with zero further tools."
  capabilities:
    - production-level-review
    - defect-detection
    - security-vulnerability-detection
    - severity-and-confidence-classification
    - quantified-risk-scoring
    - merge-decision
  modes:
    - uncommitted
    - staged
    - commit
    - branch-diff
    - file
