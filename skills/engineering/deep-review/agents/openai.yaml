interface:
  display_name: "Deep Review"
  short_description: "Fast read-only git diff review (one snapshot + oneshot report)"
  long_description: "Runs one local review_snapshot.py call that embeds the diff and small file contents, then writes production-focused findings with severity/confidence and a merge decision. Default profile is oneshot (no repo exploration). Use --profile deep only for large/security-sensitive changes."
  default_prompt: "Use $deep-review. Run exactly one snapshot script call, then write the full review immediately with zero further tools. Obey output_language from the snapshot."
  capabilities:
    - production-level-review
    - defect-detection
    - security-vulnerability-detection
    - severity-and-confidence-classification
    - quantified-risk-scoring
    - merge-decision
    - diff-snapshot
  modes:
    - uncommitted
    - staged
    - commit
    - branch-diff
    - file
