interface:
  display_name: "Deep Review"
  short_description: "Production-level code review with severity and confidence classification"
  long_description: "Performs a production-level, read-only code review of uncommitted code changes. Analyzes code intent, architecture, correctness, security, performance, reliability, and maintainability. Reviews across correctness, reliability, security, performance, architecture, testing, regression, observability, and deployment safety. Classifies findings by severity (Critical/High/Medium/Low) and confidence (Confirmed/Likely/Potential) with a final risk score and merge recommendation."
  default_prompt: "Use $deep-review to review the current code changes and report all findings."
  capabilities:
    - production-level-review
    - defect-detection
    - security-vulnerability-detection
    - performance-analysis
    - architecture-review
    - regression-analysis
    - observability-check
    - deployment-safety-check
    - severity-and-confidence-classification
    - risk-scoring
    - merge-recommendation
  modes:
    - uncommitted
    - staged
    - commit
    - branch-diff
    - file
