interface:
  display_name: "Deep Review"
  short_description: "Defect-first code review with actionable findings"
  long_description: "Performs a thorough, read-only, defect-first review of a code change (uncommitted, staged, a commit, or a branch diff) and returns every actionable finding with severity levels. Reviews across correctness, security, performance, API design, error handling, test coverage, and maintainability."
  default_prompt: "Use $deep-review to review the current code changes and report all findings."
  capabilities:
    - diff-context-collection
    - defect-first-review
    - security-vulnerability-detection
    - performance-analysis
    - api-compatibility-check
    - test-coverage-assessment
    - actionable-findings
  modes:
    - uncommitted
    - staged
    - commit
    - branch-diff
