interface:
  display_name: "Deep Review"
  short_description: "Production-level code review with severity and confidence classification"
  long_description: "Performs a production-level, read-only code review of code changes. Runs a local snapshot helper for diff stats, stack detection, and scope, then analyzes intent, architecture, correctness, security, performance, reliability, and maintainability. Classifies findings by severity (Critical/High/Medium/Low) and confidence (Confirmed/Likely/Potential) with quantified risk scoring and a merge decision."
  default_prompt: "Use $deep-review to review the current code changes and report all findings."
  capabilities:
    - production-level-review
    - defect-detection
    - security-vulnerability-detection
    - performance-analysis
    - architecture-review
    - regression-analysis
    - observability-check
    - deployment-safety-check
    - severity-and-confidence-classification
    - quantified-risk-scoring
    - merge-decision
    - tech-stack-checklists
    - diff-snapshot
  modes:
    - uncommitted
    - staged
    - commit
    - branch-diff
    - file
